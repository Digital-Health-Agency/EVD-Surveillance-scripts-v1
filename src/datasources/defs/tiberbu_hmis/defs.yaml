type: datasources.components.DltLoadSourceCollection

attributes:
  loads:
    - source: .loader.source
      pipeline: .loader.pipeline
      partitions_def:
        type: daily
        start_date: "2026-06-01"   # must match INITIAL_VALUE in loader.py
      backfill_policy:
        type: single_run           # a backfill range = one windowed run
      translation:
        key: "tiberbu_hmis/{{ resource.name }}"
        group_name: tiberbu_hmis
