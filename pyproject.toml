[project]
name = "evd_surveillance_scripts"
requires-python = ">=3.11,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.12",
    "dagster-dg-cli==1.13.12",
    "dagster-dlt==0.29.12",
    "dagster-webserver==1.13.12",
    "dlt[filesystem]==1.28.1",
    "duckdb>=1.5.4,<2",  # 2.x wheels SIGILL on the warehouse VM (QEMU CPU, no AVX)
    "grpcio<1.80",
    "grpcio-health-checking<1.80",
    "psycopg[binary]>=3.2",
    # warehouse ETL (orchestration/evd_orchestration): MinIO -> Postgres -> dbt
    "dagster-dbt==0.29.12",
    "boto3",
    "psycopg2-binary",
    "dbt-postgres>=1.8,<2.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasources", "orchestration/evd_orchestration"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.uv]
# dbt-core 1.12 pulls dbt-core-experimental-parser, whose build downloads a
# binary at install time — see docs/fresh-environment-fixes.md
constraint-dependencies = ["greenlet<3.5.0", "dbt-core<1.12"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "datasources"
registry_modules = [
    "datasources.components",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
