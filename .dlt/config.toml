# Non-secret dlt configuration. Override any value with env vars, e.g.
# DESTINATION__FILESYSTEM__BUCKET_URL=s3://other-bucket/prefix

[destination.filesystem]
# MinIO bucket — name only; the server endpoint goes in
# [destination.filesystem.credentials] (secrets.toml or env vars)
bucket_url = "s3://evd-echis/"

# Tiberbu HMIS: one entry per HMIS instance (each serves many facilities). The
# key is a short snake_case instance code: it names the asset
# (tiberbu_hmis/screenings_<code>) and tags every record. Each instance's API key
# and secret go in secrets.toml under the same key. For example:
#
# [datasources.tiberbu_hmis.instances.isiolo]
# base_url = "https://isiolo.hmis.example.org/api/method/"
#
# Or keep the list out of the repo, as env vars only:
#   DATASOURCES__TIBERBU_HMIS__INSTANCE_CODES='["isiolo", "nyeri"]'
#   DATASOURCES__TIBERBU_HMIS__INSTANCES__ISIOLO__BASE_URL=https://isiolo.hmis.example.org/api/method/
